apiVersion: quality.chillcode/v1

contract:
  base: quality-v1

security:
  baseline: security-v1
  artifactVersion: '1.2.2'

languages:
  node: true
  java: true

roots:
  node: frontend
  java: backend

capabilities:
  typescript: true
  # Backend JUnit + converter regression tests are gated; frontend has no suite.
  tests: required
  build: required
  container: false

profile:
  type: tool
  risk: elevated

coverage:
  newCodeMinimum: 80

megalinter:
  # v9.4.0's TYPESCRIPT_ES/JAVASCRIPT_ES descriptor passes --no-eslintrc, which
  # ESLint 9's flat-config CLI (this repo's frontend/eslint.config.js) rejects
  # outright ("Invalid option '--no-eslintrc'") - verified locally running the
  # shared wrapper against this repo's own frontend. v10.1.0 bundles ESLint 10
  # with native flat-config support and drops that flag (see
  # development-standards megalinter/node.yml's own comment on this exact
  # issue). Pinned to the same version docker-compose-examples already uses.
  version: v10.1.0
  osvScannerVersion: v2.2.3

standards:
  ref: standards-v1.3.2

# SEC-* entries are rendered by render-waivers.sh (prep-security-baseline) into
# .chillcode-security/trivyignore.yaml, which the OSV PR gate reads.
waivers:
  - policy: SEC-VULN-001
    owner: Marcell
    reason: >-
      picomatch is a dev-only toolchain dependency (vite, vitest, fdir,
      tinyglobby; dev true in frontend/package-lock.json) and is never shipped.
      OSV marks every version through 4.0.7 as affected and 4.0.7 is the newest
      release, so no fixed version exists to bump to. The ReDoS needs
      attacker-controlled glob patterns; this repository only evaluates its own
      committed patterns.
    ticket: ChillCode/sonarqube-quality-plugin#77
    expires: 2026-12-17
    scope: CVE-2026-112366@frontend/package-lock.json
