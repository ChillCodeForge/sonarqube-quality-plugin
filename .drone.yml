---
kind: pipeline
type: docker
name: prep
clone: { depth: 0 }
node: { runner: drone-runner }
steps:
  - name: prep-install-frontend
    image: registry.chillcode.de/dockerhub-cache/library/node:22.23.1-bookworm-slim
    environment:
      NPM_CONFIG_REGISTRY: https://artifacts.chillcode.de/npm/npm-virtual/
      NPM_CONFIG_AUDIT: "false"
    commands:
      - cd frontend && npm ci
  - name: prep-development-standards
    image: registry.chillcode.de/dockerhub-cache/alpine/git:2.47.2
    environment:
      DEPLOY_KEY:
        from_secret: devstandards_deploy_key
    commands:
      - |
        set -eu
        REF=$(sed -n '/^standards:/,/^[^[:space:]]/p' .quality.yaml \
              | sed -n 's/^[[:space:]]*ref:[[:space:]]*//p' \
              | head -n1 | sed 's/#.*//' | tr -d '[:space:]')
        if [ -z "$REF" ]; then
          echo "standards.ref is not declared in .quality.yaml." >&2
          exit 1
        fi
        echo "development-standards ref: $REF"
        rm -rf .chillcode-standards
        apk add --no-cache --quiet openssh-client >/dev/null
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        GITEA_SSH_HOST=192.168.178.33
        ssh-keyscan -t ed25519 "$GITEA_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
          git clone --quiet --depth 1 --branch "$REF" \
          "git@$GITEA_SSH_HOST:ChillCode/development-standards.git" \
          .chillcode-standards
        git -C .chillcode-standards rev-parse HEAD
  - name: prep-install-backend
    image: registry.chillcode.de/dockerhub-cache/library/maven:3.9.16-eclipse-temurin-21
    volumes: [{name: shared, path: /shared}]
    commands:
      # Resolve dependencies/plugins only; all Maven steps share dependency paths
      # and timestamps so packaging reuses the test stage's compiled classes.
      - mkdir -p /shared/m2
      - cp .chillcode-standards/java/maven/settings.xml /shared/maven-settings.xml
      - mvn -s /shared/maven-settings.xml -B -ntp -Dmaven.repo.local=/shared/m2 org.apache.maven.plugins:maven-dependency-plugin:3.8.1:go-offline -f backend/pom.xml
    depends_on: [prep-development-standards]
  - name: prep-sync
    image: alpine:3.21
    volumes: [{name: shared, path: /shared}]
    commands:
      - mkdir -p /shared/src && cp -a . /shared/src
      - mkdir -p /shared/src/.chillcode-standards && cp -a .chillcode-standards/. /shared/src/.chillcode-standards/
      - cp .chillcode-standards/java/maven/settings.xml /shared/maven-settings.xml
    depends_on: [prep-install-frontend, prep-install-backend, prep-development-standards]
trigger:
  branch: [main]
  event: [push, pull_request]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
---
kind: pipeline
type: docker
name: lint
node: { runner: drone-runner }
clone: { disable: true }
depends_on: [prep]
steps:
  - name: lint-frontend-static
    image: registry.chillcode.de/dockerhub-cache/library/node:22.23.1-bookworm-slim
    environment:
      NPM_CONFIG_REGISTRY: https://artifacts.chillcode.de/npm/npm-virtual/
      NPM_CONFIG_AUDIT: "false"
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src/frontend
        npm run lint
        npm run format:check
        npm run typecheck
  - name: lint-backend-static
    image: registry.chillcode.de/dockerhub-cache/library/maven:3.9.16-eclipse-temurin-21
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src/backend
        mvn -s /shared/maven-settings.xml -B -ntp -Dmaven.repo.local=/shared/m2 spotless:check
    depends_on: [lint-frontend-static]
  - name: lint-megalinter
    image: registry.chillcode.de/dockerhub-cache/docker:26-cli
    volumes:
      - {name: shared, path: /shared}
      - {name: megalinter-copy, path: /mlsrc}
      - {name: dockersock, path: /var/run/docker.sock}
    commands:
      - |
        set -eu
        cp -a /shared/src/. /mlsrc/
        cd /mlsrc
        status=0
        sh .chillcode-standards/ci/run-megalinter.sh . .chillcode-quality-reports || status=$?
        mkdir -p /shared/src/.chillcode-quality-reports
        cp -a .chillcode-quality-reports/. /shared/src/.chillcode-quality-reports/
        exit "$status"
    depends_on: [lint-backend-static]
  - name: report-megalinter-pr
    image: registry.chillcode.de/dockerhub-cache/python:3.11-slim
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src
        python3 .chillcode-standards/ci/generate-megalinter-pr-report.py \
          --reports-dir .chillcode-quality-reports/megalinter-reports \
          --out megalinter-pr-report.md \
          --gate-out .chillcode-quality-reports/megalinter-gate.json \
          --pipeline-context repo=ChillCode/sonarqube-quality-plugin \
          --pipeline-context build=${DRONE_BUILD_NUMBER} \
          --pipeline-context commit=${DRONE_COMMIT_SHA}
    depends_on: [lint-megalinter]
    when:
      status: [success, failure]
  - name: report-megalinter-gitea-comment
    image: registry.chillcode.de/dockerhub-cache/alpine:3.21
    environment:
      GITEA_ADDRESS: https://git.chillcode.de
      REVIEWDOG_GITEA_API_TOKEN:
        from_secret: drone-reviewdog-pr-gate
    volumes: [{name: shared, path: /shared}]
    commands:
      - apk add --no-cache curl jq >/dev/null
      - cd /shared/src && sh .chillcode-standards/ci/update-gitea-pr-comment.sh "$DRONE_REPO" "$DRONE_PULL_REQUEST" megalinter-pr-report.md
    depends_on: [report-megalinter-pr]
    when:
      event: [pull_request]
      status: [success, failure]
  - name: report-megalinter-pr-gate
    image: registry.chillcode.de/dockerhub-cache/python:3.11-slim
    volumes: [{name: shared, path: /shared}]
    commands:
      - cd /shared/src && sh .chillcode-standards/ci/megalinter-pr-gate.sh .chillcode-quality-reports/megalinter-gate.json
    depends_on: [report-megalinter-pr]
    when:
      status: [success, failure]
  - name: report-megalinter-inline-comments
    image: registry.chillcode.de/dockerhub-cache/alpine:3.21
    environment:
      GITEA_ADDRESS: https://git.chillcode.de
      REVIEWDOG_GITEA_API_TOKEN:
        from_secret: drone-reviewdog-pr-gate
    volumes: [{name: shared, path: /shared}]
    commands:
      - apk add --no-cache curl git >/dev/null
      - cd /shared/src && sh .chillcode-standards/ci/post-sarif-inline-comments.sh .chillcode-quality-reports/megalinter-reports/megalinter-report.sarif megalinter
    depends_on: [lint-megalinter]
    when:
      event: [pull_request]
      status: [success, failure]
  - name: lint-security-fs
    image: registry.chillcode.de/dockerhub-cache/aquasec/trivy:0.75.0
    volumes: [{name: shared, path: /shared}]
    commands:
      # trivy fs resolves POM parents remotely and reads mirrors only from $HOME/.m2/settings.xml.
      - mkdir -p "$HOME/.m2" && cp /shared/maven-settings.xml "$HOME/.m2/settings.xml"
      - trivy fs --exit-code 1 --severity HIGH,CRITICAL --skip-dirs target,node_modules,dist,.cache,.chillcode-standards,.chillcode-quality-reports /shared/src
    depends_on: [report-megalinter-pr-gate]
  - name: lint-cancel-build-on-failure
    depends_on: [lint-security-fs, report-megalinter-gitea-comment, report-megalinter-inline-comments]
    image: alpine:3.21
    environment:
      CI_CANCEL_TOKEN:
        from_secret: drone_ci_cancel_token
    commands:
      - |
        set -eu
        if [ -z "$${CI_CANCEL_TOKEN:-}" ]; then
          echo 'cancel token missing; skipping self-cancel'
          exit 0
        fi
        apk add --no-cache curl >/dev/null
        curl -fsS -X DELETE -H "Authorization: Bearer $${CI_CANCEL_TOKEN}" \
          "https://drone.chillcode.de/api/repos/${DRONE_REPO}/builds/${DRONE_BUILD_NUMBER}" || \
          echo 'self-cancel failed; preserving original lint failure'
    when:
      status: [failure]
trigger:
  branch: [main]
  event: [push, pull_request]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
  - name: megalinter-copy
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}/mlsrc' }
  - name: dockersock
    host: { path: /var/run/docker.sock }
---
kind: pipeline
type: docker
name: test
node: { runner: drone-runner }
clone: { disable: true }
depends_on: [prep]
steps:
  - name: test-frontend-build
    image: registry.chillcode.de/dockerhub-cache/library/node:22.23.1-bookworm-slim
    environment:
      NPM_CONFIG_REGISTRY: https://artifacts.chillcode.de/npm/npm-virtual/
      NPM_CONFIG_AUDIT: "false"
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src/frontend
        npm run build
  - name: test-backend-verify
    image: registry.chillcode.de/dockerhub-cache/library/maven:3.9.16-eclipse-temurin-21
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src/backend
        mvn -s /shared/maven-settings.xml -B -ntp -Dmaven.repo.local=/shared/m2 verify
    depends_on: [test-frontend-build]
  - name: test-converter-regression
    image: registry.chillcode.de/dockerhub-cache/library/python:3.14-slim
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src
        python3 scripts/tests/test_normalize_mutation_report.py
        python3 -m py_compile scripts/mutmut_to_stryker.py
        bash -n scripts/normalize-mutation-report.sh scripts/upload-mutation-report.sh
        sh -n .ci/deploy.sh .ci/deploy-remote.sh
    depends_on: [test-backend-verify]
trigger:
  branch: [main]
  event: [push, pull_request]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
---
kind: pipeline
type: docker
name: analysis
node: { runner: drone-runner }
clone: { disable: true }
depends_on: [lint, test]
steps:
  - name: analysis-sonarqube
    image: registry.chillcode.de/dockerhub-cache/sonarsource/sonar-scanner-cli:12
    environment:
      SONAR_HOST_URL: https://sonar.chillcode.de
      SONAR_TOKEN:
        from_secret: sonar_token
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        test -n "$${SONAR_TOKEN:-}" || { echo 'sonar_token is not set.' >&2; exit 1; }
        cd /shared/src
        test -s backend/target/site/jacoco/jacoco.xml
        sonar-scanner \
          -Dsonar.host.url="$${SONAR_HOST_URL}" \
          -Dsonar.projectKey=sonarqube-quality-plugin \
          -Dsonar.projectName='SonarQube Quality Plugin' \
          -Dsonar.sources=backend/src/main/java,frontend/src,scripts \
          -Dsonar.tests=backend/src/test,scripts/tests \
          -Dsonar.test.inclusions=**/*Test.java,**/test_*.py \
          -Dsonar.java.binaries=backend/target/classes \
          -Dsonar.java.test.binaries=backend/target/test-classes \
          -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml \
          -Dsonar.exclusions=frontend/node_modules/**,backend/target/**,frontend/dist/**,.cache/**,.chillcode-standards/**,.chillcode-quality-reports/** \
          -Dsonar.working.directory=/tmp/sonar-scanner-work \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.scm.revision="${DRONE_COMMIT_SHA}"
  - name: analysis-coverage-new-code
    image: registry.chillcode.de/dockerhub-cache/library/python:3.14
    environment:
      PIP_INDEX_URL: https://artifacts.chillcode.de/pypi/pypi-virtual/simple/
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src
        test -s backend/target/site/jacoco/jacoco.xml
        pip install --no-cache-dir --quiet 'diff-cover==10.5.1' 'PyYAML==6.0.3'
        MINIMUM=$(python3 -c 'import yaml; value = yaml.safe_load(open(".quality.yaml"))["coverage"]["newCodeMinimum"]; assert type(value) is int and 0 < value <= 100; print(value)')
        TARGET="$${DRONE_TARGET_BRANCH:-main}"
        attempt=1
        until git fetch --no-tags --quiet origin "+refs/heads/$${TARGET}:refs/remotes/origin/$${TARGET}"; do
          if [ "$${attempt}" -ge 3 ]; then
            echo "Could not fetch the target branch $${TARGET}." >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 5
        done
        # JaCoCo uses package-relative source names; map them to the Git root.
        diff-cover backend/target/site/jacoco/jacoco.xml \
          --src-roots backend/src/main/java \
          --compare-branch="origin/$${TARGET}" \
          --fail-under="$${MINIMUM}"
    depends_on: [analysis-sonarqube]
    when:
      event: [pull_request]
trigger:
  branch: [main]
  event: [push, pull_request]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
---
kind: pipeline
type: docker
name: build
node: { runner: drone-runner }
clone: { disable: true }
depends_on: [analysis]
steps:
  - name: build-package
    image: registry.chillcode.de/dockerhub-cache/library/maven:3.9.16-eclipse-temurin-21
    volumes: [{name: shared, path: /shared}]
    commands:
      - |
        set -eu
        cd /shared/src/backend
        mvn -s /shared/maven-settings.xml -B -ntp -Dmaven.repo.local=/shared/m2 -DskipTests package
trigger:
  branch: [main]
  event: [push, pull_request]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
---
kind: pipeline
type: docker
name: release
node: { runner: drone-runner }
clone: { disable: true }
depends_on: [build]
steps:
  - name: release-deploy-plugin
    image: registry.chillcode.de/dockerhub-cache/library/alpine:3.21
    environment:
      DEPLOY_KEY_B64:
        from_secret: sonarqube_plugin_deploy_key
      MUTATION_UPLOAD_TOKEN:
        from_secret: mutation_upload_token
    volumes: [{name: shared, path: /shared}]
    commands:
      - cd /shared/src && sh .ci/deploy.sh
    when:
      ref:
        - refs/heads/main
      event:
        - push
trigger:
  branch: [main]
  event: [push]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
---
kind: pipeline
type: docker
name: cleanup
node: { runner: drone-runner }
clone: { disable: true }
depends_on: [prep, lint, test, analysis, build, release]
steps:
  - name: cleanup-shared
    image: alpine:3.21
    volumes: [{name: shared, path: /shared}]
    commands:
      - rm -rf /shared/src /shared/mlsrc /shared/maven-settings.xml /shared/digest /shared/image.tar
trigger:
  branch: [main]
  event: [push, pull_request]
  status: [success, failure]
volumes:
  - name: shared
    host: { path: '/var/lib/drone-shared/${DRONE_REPO_NAME}/${DRONE_BUILD_NUMBER}' }
